<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3E3C8">
  <title>Hold Up! / Peraí!</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Welcome: the language is chosen here, once. Its texts are filled in by
       game.js from both language files. -->
  <div class="welcome" id="welcome" hidden>
    <div class="welcome-top">
      <h1 class="welcome-title" id="welcome-title"></h1>
      <div class="welcome-cast" id="welcome-cast" aria-hidden="true"></div>
    </div>
    <div class="welcome-choice" role="group" aria-labelledby="welcome-prompt">
      <p class="welcome-prompt" id="welcome-prompt"></p>
      <div class="welcome-buttons" id="welcome-buttons"></div>
    </div>
  </div>

  <div class="chat" id="chat" hidden>
    <header class="chat-bar">
      <div class="who" id="group-who">
        <div class="group-icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z"/></svg>
        </div>
        <div class="chat-title">
          <h1 class="chat-name" data-text="familyGroupName"></h1>
          <p class="chat-members" data-text="familyMembers"></p>
        </div>
      </div>
      <!-- A one-on-one chat, while you reply to someone privately -->
      <div class="who" id="private-who" hidden></div>
      <div class="score-chip" id="score">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>
        <span id="score-value"></span>
      </div>
      <button class="icon-button" id="settings-button" type="button" data-label="settings" aria-expanded="false" aria-controls="settings-panel">
        <svg width="22" height="22" viewBox="0 0 24 24" overflow="visible" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <div class="settings-panel" id="settings-panel" hidden>
        <button class="menu-item" id="start-over" type="button">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          <span data-text="startOver"></span>
        </button>
        <!-- For building and testing only: take it out before strangers playtest -->
        <div class="test-menu">
          <div class="menu-label" data-text="test"></div>
          <div class="menu-row">
            <span class="menu-row-name" data-text="jumpToPost"></span>
            <div class="pills" id="jump-buttons"></div>
          </div>
          <div class="menu-row">
            <span class="menu-row-name" data-text="language"></span>
            <div class="pills" id="language-buttons"></div>
          </div>
          <div class="menu-row">
            <span class="menu-row-name" data-text="showNumbers"></span>
            <div class="pills" id="numbers-buttons"></div>
          </div>
        </div>
      </div>
    </header>
    <main class="chat-messages" id="messages" data-label="messagesName"></main>
    <section class="panel" id="panel" aria-live="polite" hidden></section>
  </div>

  <script src="settings.js"></script>
  <script src="lang/en.js"></script>
  <script src="lang/pt-BR.js"></script>
  <script src="characters.js"></script>
  <script src="illustrations.js"></script>
  <script src="posts/family.js"></script>
  <script src="scoring.js"></script>
  <script src="game.js"></script>
</body>
</html>
