<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat screen sketch</title>
  <!-- A sketch of the chat screen: Cousin Nina's first post (posts/family.js)
       through the whole loop at phone size, then the computer layout from the
       GDD. Follows ART.md. Nothing here is the game, and nothing is clickable
       except the language switch. -->
  <link rel="stylesheet" href="../fonts/fonts.css">
  <style>
    :root {
      --cream: #FBF3E6;
      --sand: #F3E3C8;
      --white: #FFFFFF;
      --ink: #3B2A20;
      --cocoa: #6B5444;
      --muted: #7A5E48;
      --rust: #B4472A;
      --brick: #9A4A28;
      --terracotta: #E07A55;
      --blush: #FBE3D6;
      --sage: #3F6B47;
      --marigold: #F6D27A;
      --marigold-accent: #F2B33D;
      --shadow: #EAD9BF;
      --card: #F7EBD8;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--white); color: var(--ink); font-family: "Nunito", system-ui, sans-serif; }
    .display { font-family: "Fredoka", "Nunito", sans-serif; font-weight: 600; }

    .page-head { max-width: 1180px; margin: 0 auto; padding: 24px 16px 8px; display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .page-head h1 { margin: 0; font-size: 26px; }
    .page-head p { margin: 4px 0 0; color: var(--cocoa); font-size: 15.5px; line-height: 1.4; max-width: 640px; }
    .switch { display: flex; padding: 3px; background: var(--sand); border-radius: 999px; }
    .switch button { min-width: 44px; min-height: 44px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; color: var(--ink); font: inherit; font-weight: 800; font-size: 14px; cursor: pointer; }
    .switch button[aria-pressed="true"] { background: var(--white); box-shadow: 0 1px 0 var(--shadow); }

    .steps { max-width: 1180px; margin: 0 auto; padding: 16px; display: flex; flex-wrap: wrap; justify-content: center; gap: 32px 24px; }
    .step { width: 360px; max-width: 100%; }
    .step-label { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; min-height: 64px; }
    .step-num { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--rust); color: var(--white); display: grid; place-items: center; font-weight: 800; font-size: 14px; margin-top: 1px; }
    .step-label h2 { margin: 0; font-size: 17px; }
    .step-label p { margin: 2px 0 0; font-size: 13px; color: var(--cocoa); line-height: 1.35; }

    /* A phone */
    .phone { position: relative; width: 360px; max-width: 100%; height: 720px; border-radius: 28px; overflow: hidden; background: var(--cream); display: flex; flex-direction: column; box-shadow: 0 1px 0 var(--shadow), 0 14px 36px rgba(59, 42, 32, 0.14); }
    .bar { display: flex; align-items: center; gap: 10px; padding: 12px 6px 12px 14px; background: var(--sand); }
    .group-icon { flex: none; width: 42px; height: 42px; border-radius: 50%; background: var(--rust); color: var(--white); display: grid; place-items: center; }
    .bar-title { flex: 1; min-width: 0; }
    .bar-name { font-size: 18px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar-members { font-size: 12.5px; color: var(--cocoa); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar .icon { width: 44px; height: 44px; display: grid; place-items: center; flex: none; }

    .messages { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 12px; padding: 14px 14px 16px; }
    .day { align-self: center; font-size: 12px; font-weight: 700; color: var(--cocoa); background: var(--sand); padding: 4px 12px; border-radius: 999px; }
    .row { display: flex; align-items: flex-end; gap: 8px; }
    .row.mine { justify-content: flex-end; }
    .bubble { max-width: 262px; background: var(--white); border-radius: 18px 18px 18px 6px; padding: 8px 13px 9px; box-shadow: 0 1px 0 var(--shadow); font-size: 15.5px; line-height: 1.4; }
    .mine .bubble { background: var(--blush); border-radius: 18px 18px 6px 18px; }
    .sender { font-size: 13px; font-weight: 800; color: var(--brick); }
    .post { width: 270px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
    .post.judged { box-shadow: 0 0 0 2.5px var(--terracotta); }
    .post-top { display: flex; justify-content: space-between; align-items: center; padding: 0 5px; }
    .forwarded { display: flex; align-items: center; gap: 4px; font-size: 12px; font-style: italic; color: var(--cocoa); }
    .preview { border-radius: 12px; overflow: hidden; background: var(--card); }
    .preview-body { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 3px; }
    .site { font-size: 12px; color: var(--muted); }
    .headline { font-size: 16px; line-height: 1.25; }
    .post-text { padding: 0 5px; }
    .post-foot { display: flex; justify-content: space-between; align-items: center; padding: 0 5px 2px; }
    .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 800; border-radius: 999px; padding: 3px 9px; }
    .chip-blush { color: var(--brick); background: var(--blush); }
    .time { font-size: 12px; color: var(--muted); }
    .highlight { border-radius: 6px; box-shadow: 0 0 0 2.5px var(--terracotta); background: var(--white); }

    /* Bottom panel and tray */
    .panel { display: flex; flex-direction: column; gap: 10px; padding: 14px 14px 22px; background: var(--sand); border-radius: 22px 22px 0 0; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .panel-title { font-size: 17px; }
    .hint { display: flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--cocoa); }
    .verdicts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .verdict { height: 64px; border: 0; border-radius: 16px; font: inherit; font-weight: 800; font-size: 14.5px; line-height: 1.15; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0 4px; text-align: center; }
    .v-share { background: var(--sage); color: var(--white); }
    .v-stop { background: var(--terracotta); color: var(--ink); }
    .v-context { background: var(--marigold); color: var(--ink); }
    .verdicts.chosen .verdict:not(.picked) { opacity: 0.35; }
    .verdict.picked { box-shadow: 0 0 0 2.5px var(--white), 0 0 0 5px var(--ink); }

    .tools { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .tool { min-height: 72px; border-radius: 16px; background: var(--white); box-shadow: 0 1px 0 var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 6px 4px; text-align: center; font-size: 13px; font-weight: 800; line-height: 1.15; }
    .tool.used { box-shadow: 0 0 0 2.5px var(--ink); }
    .cost { display: inline-flex; align-items: center; gap: 2px; font-size: 11.5px; font-weight: 700; color: var(--cocoa); }
    .zoom-card { background: var(--white); border-radius: 12px; padding: 12px; box-shadow: 0 1px 0 var(--shadow); }
    .zoom-card .label { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; color: var(--cocoa); }
    .zoom-address { margin-top: 8px; font-size: 24px; font-weight: 800; letter-spacing: .01em; overflow-wrap: anywhere; }
    .zoom-address .off { background: var(--blush); color: var(--brick); border-radius: 6px; padding: 0 3px; }
    .zoom-fine { margin-top: 6px; font-size: 12px; color: var(--muted); }
    .spread { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--brick); }

    .clues { display: flex; flex-wrap: wrap; gap: 8px; }
    .clue { min-height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 0 14px; border-radius: 999px; background: var(--white); box-shadow: 0 1px 0 var(--shadow); font-weight: 700; font-size: 14px; }
    .clue.picked { box-shadow: 0 0 0 2.5px var(--ink); font-weight: 800; }
    .primary { min-height: 52px; border: 0; border-radius: 16px; background: var(--rust); color: var(--white); font: inherit; font-weight: 800; font-size: 15.5px; display: flex; align-items: center; justify-content: center; gap: 8px; }

    .tabs { display: grid; grid-template-columns: 1fr 1fr; padding: 3px; background: var(--cream); border-radius: 999px; }
    .tabs span { min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 999px; font-size: 13px; font-weight: 700; text-align: center; padding: 0 8px; line-height: 1.15; }
    .tabs .on { background: var(--white); font-weight: 800; box-shadow: 0 1px 0 var(--shadow); }
    .reply-options { display: flex; flex-direction: column; gap: 8px; }
    .reply-option { display: flex; gap: 10px; align-items: flex-start; background: var(--white); border-radius: 16px; padding: 10px 12px; box-shadow: 0 1px 0 var(--shadow); font-size: 14px; line-height: 1.35; }
    .reply-option .dot { flex: none; width: 20px; height: 20px; margin-top: 1px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--cocoa); display: grid; place-items: center; }
    .reply-option.picked { box-shadow: 0 0 0 2.5px var(--ink); }
    .reply-option.picked .dot { background: var(--ink); color: var(--white); box-shadow: none; }

    .system { align-self: center; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--cocoa); background: var(--sand); border-radius: 999px; padding: 5px 12px; text-align: center; }
    .meter { display: flex; flex-direction: column; gap: 6px; background: var(--white); border-radius: 16px; padding: 10px 12px; box-shadow: 0 1px 0 var(--shadow); }
    .meter-row { display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; }
    .meter-track { height: 10px; border-radius: 999px; background: var(--sand); overflow: hidden; }
    .meter-fill { height: 100%; border-radius: 999px; background: var(--sage); }

    /* The computer layout */
    .desktop-step { width: 100%; max-width: 1148px; }
    .desktop-scroll { overflow-x: auto; padding-bottom: 8px; }
    .desktop { width: 1100px; height: 640px; border-radius: 20px; overflow: hidden; background: var(--cream); display: grid; grid-template-columns: 260px 1fr 300px; grid-template-rows: minmax(0, 1fr); box-shadow: 0 1px 0 var(--shadow), 0 14px 36px rgba(59, 42, 32, 0.14); }
    .list { background: var(--sand); padding: 14px 10px; display: flex; flex-direction: column; gap: 6px; }
    .list-title { font-size: 18px; padding: 4px 8px 8px; }
    .chat-item { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 16px; min-height: 56px; }
    .chat-item.on { background: var(--white); box-shadow: 0 1px 0 var(--shadow); }
    .chat-item .group-icon { width: 38px; height: 38px; }
    .chat-item .locked { background: var(--muted); }
    .chat-item .t { font-weight: 800; font-size: 13.5px; line-height: 1.25; }
    .chat-item .s { font-size: 12px; color: var(--muted); }
    .middle { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .side { background: var(--sand); padding: 14px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
    .rule { background: var(--white); border-radius: 12px; padding: 12px; box-shadow: 0 1px 0 var(--shadow); font-size: 14px; line-height: 1.4; }
    .rule h3 { margin: 0 0 4px; font-size: 16px; }
    .rule .kicker { font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }

    @media (max-width: 400px) {
      .phone { height: 700px; }
    }
  </style>
</head>

  <div class="steps" id="steps"></div>

  <script src="../characters.js"></script>
  <script src="../posts/family.js"></script>

      '<rect x="168" y="22" width="56" height="36" rx="6" fill="#FBF3E6" transform="rotate(12 196 40)"/>' +
      '<rect x="176" y="34" width="26" height="5" rx="2.5" fill="#F2B33D" transform="rotate(12 196 40)"/>' +
      '<circle cx="48" cy="26" r="4" fill="#FBF3E6"/><circle cx="66" cy="70" r="3" fill="#FBF3E6"/><circle cx="214" cy="80" r="3.5" fill="#FBF3E6"/>' +
      "</svg>";

    function header(t) {
      return '<div class="bar"><div class="group-icon">' + ic(I.house) + "</div>" +
        '<div class="bar-title"><div class="bar-name display">' + esc(t.group) + "</div>" +
        '<div class="bar-members">' + esc(t.members) + "</div></div>" +
        '<div class="icon">' + ic(I.gear) + "</div></div>";
    }

    function row(id, face, name, text) {
      return '<div class="row">' + Characters.avatar(id, face, 44) +
        '<div class="bubble"><div class="sender">' + esc(name) + "</div>" + esc(text) + "</div></div>";
    }

    // Nina's post as it lands in the chat; `address` swaps in a highlighted address
    function ninaPost(t, opts) {
      var p = post.text[language];
      return '<div class="row">' + Characters.avatar("nina", "neutral", 44) +
        '<div class="bubble post' + (opts.judged ? " judged" : "") + '">' +
        '<div class="post-top"><div class="sender">' + esc(t.nina) + '</div><div class="forwarded">' + ic(I.forward, 14) + esc(t.forwarded) + "</div></div>" +
        '<div class="preview">' + GIFT + '<div class="preview-body">' +
        '<div class="site"><span class="' + (opts.highlightAddress ? "highlight" : "") + '">' + esc(p.source.url) + "</span></div>" +
        '<div class="headline display">' + esc(p.headline) + "</div></div></div>" +
        '<div class="post-text">' + esc(p.message) + "</div>" +
        '<div class="post-foot"><span class="chip chip-blush">' + ic(I.spread, 13, 2.4) + esc(fill(t.forwardedTimes, opts.forwards)) + '</span><span class="time">8:14</span></div>' +
        "</div></div>";
    }

    function chatTop(t) {
      return '<div class="day">' + esc(t.today) + "</div>" +
        row("rosa", "neutral", t.rosa, t.rosaSays) +
        row("mom", "neutral", t.mom, t.momSays);
    }

    function verdicts(t, picked) {
      var b = function (cls, key, icon) {
        return '<div class="verdict ' + cls + (picked === key ? " picked" : "") + '">' + ic(icon) + esc(t[key]) + "</div>";
      };
      return '<div class="verdicts' + (picked ? " chosen" : "") + '">' + b("v-share", "share", I.share) + b("v-stop", "stop", I.stop) + b("v-context", "context", I.context) + "</div>";
    }

    function phone(inner) { return '<div class="phone">' + inner + "</div>"; }

    function step(n, t, body, wide) {
      var s = t.steps[n - 1];
      return '<section class="step' + (wide ? " desktop-step" : "") + '"><div class="step-label"><div class="step-num">' + n + "</div><div>" +
        '<h2 class="display">' + esc(s[0]) + "</h2><p>" + esc(s[1]) + "</p></div></div>" + body + "</section>";
    }

    function addressParts(url) {
      // Marks the part that gives the copycat away: everything after the store's name
      var cut = url.indexOf("-");
      return esc(url.slice(0, cut)) + '<span class="off">' + esc(url.slice(cut)) + "</span>";
    }

    function render() {
      var t = T[language];
      var p = post.text[language];
      document.documentElement.lang = language;
      document.title = t.title;
      document.getElementById("title").textContent = t.title;
      document.getElementById("intro").textContent = t.intro;
      document.querySelectorAll(".switch button").forEach(function (b) {
        b.setAttribute("aria-pressed", String(b.dataset.lang === language));
      });

      var s1 = phone(header(t) +
        '<div class="messages">' + chatTop(t) + ninaPost(t, { judged: true, forwards: 12 }) + "</div>" +
        '<div class="panel"><div class="panel-head"><div class="panel-title display">' + esc(t.yourCall) + "</div>" +
        '<div class="hint">' + ic(I.zoom, 15) + esc(t.tapToCheck) + "</div></div>" + verdicts(t) + "</div>");

      var s2 = phone(header(t) +
        '<div class="messages">' + ninaPost(t, { judged: true, forwards: 12, highlightAddress: true }) + "</div>" +
        '<div class="panel">' +
        '<div class="zoom-card"><div class="label">' + ic(I.zoom, 14) + esc(t.zoom) + "</div>" +
        '<div class="zoom-address">' + addressParts(p.source.url) + "</div>" +
        '<div class="zoom-fine">' + esc(p.finePrint) + "</div></div>" +
        '<div class="spread">' + ic(I.spread, 15, 2.4) + esc(fill(t.spread, 12)) + "</div>" +
        '<div class="tools">' +
        '<div class="tool used">' + ic(I.zoom) + esc(t.zoom) + '<span class="cost">' + esc(t.free) + "</span></div>" +
        '<div class="tool">' + ic(I.person) + esc(t.sourceCard) + '<span class="cost">' + ic(I.clock, 12) + "+1</span></div>" +
        '<div class="tool">' + ic(I.article) + esc(t.openArticle) + '<span class="cost">' + ic(I.clock, 12) + "+1</span></div>" +
        "</div></div>");

      var s3 = phone(header(t) +
        '<div class="messages">' + ninaPost(t, { judged: true, forwards: 14, highlightAddress: true }) + "</div>" +
        '<div class="panel">' + verdicts(t, "stop") +
        '<div class="panel-title display">' + esc(t.giveaway) + "</div>" +
        '<div class="clues">' +
        '<span class="clue picked">' + ic(I.check, 16) + esc(t.clueAddress) + "</span>" +
        '<span class="clue">' + esc(t.clueFine) + "</span>" +
        '<span class="clue">' + esc(t.clueHeadline) + "</span>" +
        '<span class="clue">' + esc(t.cluePhoto) + "</span></div>" +
        '<div class="primary">' + ic(I.check, 18) + esc(t.thatsIt) + "</div></div>");

      var s4 = phone(header(t) +
        '<div class="messages">' + ninaPost(t, { judged: true, forwards: 14 }) + "</div>" +
        '<div class="panel">' +
        '<div class="tabs"><span>' + esc(t.inGroup) + '</span><span class="on">' + ic(I.check, 14) + esc(t.privately) + "</span></div>" +
        '<div class="reply-options">' + post.replies.map(function (r, i) {
          return '<div class="reply-option' + (i === 0 ? " picked" : "") + '"><span class="dot">' + (i === 0 ? ic(I.check, 13, 3) : "") + "</span><span>" + esc(r[language]) + "</span></div>";
        }).join("") + "</div>" +
        '<div class="primary">' + ic(I.send, 18) + esc(t.send) + "</div></div>");

      var s5 = phone('<div class="bar"><div class="icon">' + ic(I.back) + "</div>" + Characters.avatar("nina", "relieved", 42) +
        '<div class="bar-title"><div class="bar-name display">' + esc(t.ninaShort) + '</div><div class="bar-members">' + esc(t.privateChat) + "</div></div></div>" +
        '<div class="messages">' +
        '<div class="row mine"><div class="bubble">' + esc(post.replies[0][language]) + "</div></div>" +
        '<div class="row">' + Characters.avatar("nina", "relieved", 44) + '<div class="bubble">' + esc(t.ninaAnswers) + "</div></div>" +
        '<div class="system">' + ic(I.trash, 15) + esc(t.deleted) + "</div>" +
        '<div class="system">' + ic(I.stop, 15) + esc(t.stopped) + "</div>" +
        '<div class="meter"><div class="meter-row"><span>' + esc(t.trust) + '</span><span>' + ic(I.up, 13, 2.6) + " " + esc(t.trustUp) + "</span></div>" +
        '<div class="meter-track"><div class="meter-fill" style="width:65%"></div></div></div>' +
        "</div>");

      var desktop = '<div class="desktop-scroll"><div class="desktop">' +
        '<div class="list"><div class="list-title display">' + esc(t.chats) + "</div>" +
        '<div class="chat-item on"><div class="group-icon">' + ic(I.house, 20) + '</div><div><div class="t">' + esc(t.group) + '</div><div class="s">' + esc(t.nina) + ": " + esc(p.headline) + "</div></div></div>" +
        [t.friends, t.school, t.work].map(function (name) {
          return '<div class="chat-item"><div class="group-icon locked">' + ic(I.lock, 18) + '</div><div><div class="t">' + esc(name) + '</div><div class="s">' + esc(t.later) + "</div></div></div>";
        }).join("") + "</div>" +
        '<div class="middle">' + header(t) + '<div class="messages">' + chatTop(t) + ninaPost(t, { judged: true, forwards: 12, highlightAddress: true }) + "</div>" +
        '<div class="panel"><div class="panel-head"><div class="panel-title display">' + esc(t.yourCall) + "</div></div>" + verdicts(t) + "</div></div>" +
        '<div class="side"><div class="panel-title display">' + esc(t.tools) + "</div>" +
        '<div class="zoom-card"><div class="label">' + ic(I.zoom, 14) + esc(t.zoom) + '</div><div class="zoom-address">' + addressParts(p.source.url) + '</div><div class="zoom-fine">' + esc(p.finePrint) + "</div></div>" +
        '<div class="tools"><div class="tool used">' + ic(I.zoom) + esc(t.zoom) + '</div><div class="tool">' + ic(I.person) + esc(t.sourceCard) + '</div><div class="tool">' + ic(I.article) + esc(t.openArticle) + "</div></div>" +
        '<div class="panel-title display">' + ic(I.book, 18) + " " + esc(t.rulebook) + "</div>" +
        '<div class="rule"><div class="kicker">' + esc(t.rulePage) + '</div><h3 class="display">' + esc(t.ruleTitle) + "</h3>" + esc(t.ruleText) + "</div>" +
        "</div></div></div>";

      document.getElementById("steps").innerHTML =
        step(1, t, s1) + step(2, t, s2) + step(3, t, s3) + step(4, t, s4) + step(5, t, s5) + step(6, t, desktop, true);
    }

    document.querySelectorAll(".switch button").forEach(function (b) {
      b.addEventListener("click", function () { language = b.dataset.lang; render(); });
    });
    render();
  </script>
</body>
</html>
