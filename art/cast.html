<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cast sheet</title>
  <!-- Every Family character with every face, big and at avatar size (44px).
       The drawings come from ../characters.js; see ART.md. -->
  <link rel="stylesheet" href="../fonts/fonts.css">
  <style>
    :root {
      --cream: #FBF3E6;
      --sand: #F3E3C8;
      --white: #FFFFFF;
      --ink: #3B2A20;
      --cocoa: #6B5444;
      --brick: #9A4A28;
      --shadow: #EAD9BF;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px 40px;
      background: var(--cream);
      color: var(--ink);
      font-family: "Nunito", sans-serif;
    }
    h1, h2 { font-family: "Fredoka", sans-serif; font-weight: 600; margin: 0; }
    h1 { font-size: 24px; }
    .intro { margin: 4px 0 24px; color: var(--cocoa); font-size: 15.5px; line-height: 1.4; }
    .character { margin: 0 auto 28px; max-width: 760px; }
    h2 { font-size: 18px; margin-bottom: 10px; }
    h2 span { font-family: "Nunito", sans-serif; font-weight: 700; font-size: 13px; color: var(--cocoa); }
    .faces {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }
    .face {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 14px 8px 12px;
      background: var(--white);
      border-radius: 12px;
      box-shadow: 0 1px 0 var(--shadow);
    }
    .face .big { width: 100%; max-width: 140px; aspect-ratio: 1; }
    .face .big .avatar { width: 100% !important; height: 100% !important; }
    .face .big svg { width: 100%; height: 100%; }
    .face .label { text-align: center; font-size: 13px; font-weight: 800; color: var(--brick); }
    .face .label small { display: block; font-size: 12px; font-weight: 400; color: var(--cocoa); }
    @media (max-width: 560px) {
      .faces { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="character">
    <h1>Cast sheet</h1>
    <p class="intro">Each character, each face: big, then at avatar size (44px).</p>
  </div>
  <div id="cast"></div>

  <script src="../characters.js"></script>
  <script>
    // Names and reactions for this check page only; the game takes them from lang/.
    var NAMES = {
      jorge: ["Grandpa Jorge", "Vô Jorge"],
      nina: ["Cousin Nina", "Prima Nina"],
      rosa: ["Aunt Rosa", "Tia Rosa"],
      mom: ["Mom", "Mãe"]
    };
    var REACTIONS = {
      neutral: "ignores",
      relieved: "accepts",
      stung: "accepts, but stung",
      pouting: "digs in"
    };

    document.getElementById("cast").innerHTML = Characters.ids.map(function (id) {
      return '<section class="character"><h2>' + NAMES[id][0] + " <span>· " + NAMES[id][1] + "</span></h2>" +
        '<div class="faces">' +
        Characters.faces.map(function (face) {
          var label = NAMES[id][0] + ", " + face;
          return '<div class="face">' +
            '<div class="big">' + Characters.avatar(id, face, 140, label) + "</div>" +
            Characters.avatar(id, face, 44) +
            '<div class="label">' + face + "<small>" + REACTIONS[face] + "</small></div>" +
            "</div>";
        }).join("") +
        "</div></section>";
    }).join("");
  </script>
</body>
</html>
